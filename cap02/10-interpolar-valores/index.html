<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script type="text/babel" data-type="module">
      import React from "https://esm.sh/react@19.2.0?dev";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";



      const menuItem = {

        id: 1,
        iceCream: {

          id:3,
          name: "Guayaba",
          imagePath: "imagenes/mora.svg",

        },

        precio: 1.50,
        description: "Mora de Ambato con un toque de limón.",
      

      };

      const menu = (
        <>
        <main>
          <h1>La Heladeria</h1>

          {/* Primera Sección */}

          <article className="menu-item"  aria-labelledby="flavor-mora">
            <img src={menuItem.iceCream.imagePath}/>
            <h2 id="flavor-mora">{menuItem.iceCream.name}</h2>
            <p className="menu-item-description">
              {menuItem.description}
              </p>
            <p>{menuItem.precio}</p>
              </article>

        </main>

        <footer>
         <p>Heladeria--Ambato</p>
        </footer>
        </>
      );

      const container = document.getElementById("root");
      createRoot(container).render(menu);
    </script>
  </body>
</html>
