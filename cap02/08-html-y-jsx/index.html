<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img src="mora.svg" alt="Helado de mora silvestre" class="photo" />
    <label for="description">Descripción</label>
    <input id="description" maxlength="120" readonly class="field" />

    <div id="root">
      <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
      <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        const field = (
          <>
            <img
              src="mora.svg"
              alt="Helado de mora silvestre"
              className="photo"
            />
            <label htmlFor="description">Descripción</label>
            <input
              id="descripcion"
              maxLength="120"
              readOnly
              className="field"
            />
          </>
        );

        createRoot(document.getElementById("root")).render(field);
      </script>
    </div>
  </body>
</html>
