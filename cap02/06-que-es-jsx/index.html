<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script type="text/babel" data-type="module">
      import React from "https://esm.sh/react@19.2.0?dev";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

      const heading = <h1>La Heladería</h1>;

      //const itemName1 = React.createElement("h2", null, "Mora Silvestre");

      const description  = <h2>Mora silvestre</h2>;

      // const itemDescription = React.createElement(
      //   "p",
      //   { className: "menu-item-description" },
      //   "Helado de Mora orgánica."
      // );

      const itemDescription = <p class="menu-item-description"> Helado de Mora Orgánica perros</p>

      const menuItem = React.createElement(
        "article",
        { className: "menu-item" },
        description,
        itemDescription
      );

      const menu = React.createElement("main", null, heading, menuItem);

      const container = document.getElementById("root");
        createRoot(container).render(menu);

      console.log(heading);
    </script>
  </body>
</html>
